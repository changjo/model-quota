name: Release

# Publishes a GitHub Release when a push to main sets CFBundleShortVersionString
# in Resources/Info.plist to a version that has no v<version> tag yet.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.tag.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Read app version
        id: version
        run: |
          version="$(python3 scripts/release-version.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check for an existing tag
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null || status=$?
          case "$status" in
            0) echo "v$VERSION already exists; nothing to release."
               echo "release=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "v$VERSION has no tag; releasing."
               echo "release=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::git ls-remote failed with exit code $status"
               exit 1 ;;
          esac

  release:
    needs: check
    # Forks that enable Actions must not publish their own releases.
    if: github.repository == 'changjo/model-quota' && needs.check.outputs.release == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: xcodebuild -version

      - name: Test
        run: swift test

      - name: Package
        run: ./scripts/package-app.sh

      # Future: Developer ID signing and notarization go here.

      - name: Remove a leftover draft release
        run: |
          if is_draft="$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2> /dev/null)"; then
            if [ "$is_draft" = "true" ]; then
              gh release delete "v$VERSION" --yes
            else
              echo "::error::Release v$VERSION was published after the version check ran"
              exit 1
            fi
          fi

      # The release stays a draft until both assets are uploaded; publishing creates the tag.
      - name: Create draft release
        run: |
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" \
            --title "Model Quota $VERSION" \
            --notes-file .github/release-notes.md --generate-notes \
            "dist/Model-Quota-$VERSION-macos-arm64.zip" \
            "dist/Model-Quota-$VERSION-macos-arm64.zip.sha256"

      - name: Publish release
        run: gh release edit "v$VERSION" --draft=false
